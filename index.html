
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZON-Снайпер</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 16px;
      text-align: center;
      background: #172633;
    }
    h2 { margin: 0; color: #42d392; }
    .price {
      padding: 12px;
      text-align: center;
      color: #42d392;
    }
    .chart {
      width: 100%;
      height: 75vh;
      min-height: 450px;
    }
  </style>
</head>
<body>
  <header>
    <h2>OZON-СНАЙПЕР</h2>
    <div>Автоматический анализ акций OZON</div>
  </header>

  <div class="price">
    График OZON — TradingView
  </div>

  <div class="chart">
    <div class="tradingview-widget-container"
         style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget"
           style="height:100%;width:100%"></div>
      <script
        type="text/javascript"
        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
        async>
      {
        "autosize": true,
        "symbol": "RUS:OZON",
        "interval": "5",
        "timezone": "Europe/Moscow",
        "theme": "dark",
        "style": "1",
        "locale": "ru",
        "allow_symbol_change": false,
        "calendar": false,
        "hide_side_toolbar": false,
        "hide_top_toolbar": false,
        "save_image": false,
        "withdateranges": true,
        "details": false,
        "hotlist": false,
        "studies": ["Volume@tv-basicstudies"]
      }
      </script>
    </div>
  </div>
</body>
</html>
